# Pomenovane pozy. Hodnoty su v radianoch.
# Znamienka pri crouch su odhad (prevzate z H1) - over na fixed_base:=true.
# Prsty maju zrkadlove znamienka: lava ruka zaporne, prava kladne.
poses:

  stand:
    duration: 3.0
    left_hip_pitch_joint: 0.0
    left_hip_roll_joint: 0.0
    left_hip_yaw_joint: 0.0
    left_knee_joint: 0.0
    left_ankle_pitch_joint: 0.0
    left_ankle_roll_joint: 0.0
    right_hip_pitch_joint: 0.0
    right_hip_roll_joint: 0.0
    right_hip_yaw_joint: 0.0
    right_knee_joint: 0.0
    right_ankle_pitch_joint: 0.0
    right_ankle_roll_joint: 0.0
    waist_yaw_joint: 0.0
    waist_roll_joint: 0.0
    waist_pitch_joint: 0.0
    left_shoulder_pitch_joint: 0.0
    left_shoulder_roll_joint: 0.0
    left_shoulder_yaw_joint: 0.0
    left_elbow_joint: 0.0
    right_shoulder_pitch_joint: 0.0
    right_shoulder_roll_joint: 0.0
    right_shoulder_yaw_joint: 0.0
    right_elbow_joint: 0.0

  arms_forward:
    duration: 3.0
    left_shoulder_pitch_joint: -1.5
    right_shoulder_pitch_joint: -1.5

  arms_down:
    duration: 3.0
    left_shoulder_pitch_joint: 0.0
    right_shoulder_pitch_joint: 0.0
    left_elbow_joint: 0.0
    right_elbow_joint: 0.0

  crouch:
    duration: 4.0
    left_hip_pitch_joint: -0.3
    right_hip_pitch_joint: -0.3
    left_knee_joint: 0.6
    right_knee_joint: 0.6
    left_ankle_pitch_joint: -0.3
    right_ankle_pitch_joint: -0.3

  hand_open:
    duration: 1.5
    left_hand_thumb_0_joint: 0.0
    left_hand_thumb_1_joint: 0.0
    left_hand_thumb_2_joint: 0.0
    left_hand_index_0_joint: 0.0
    left_hand_index_1_joint: 0.0
    left_hand_middle_0_joint: 0.0
    left_hand_middle_1_joint: 0.0
    right_hand_thumb_0_joint: 0.0
    right_hand_thumb_1_joint: 0.0
    right_hand_thumb_2_joint: 0.0
    right_hand_index_0_joint: 0.0
    right_hand_index_1_joint: 0.0
    right_hand_middle_0_joint: 0.0
    right_hand_middle_1_joint: 0.0

  hand_close:
    duration: 1.5
    left_hand_thumb_1_joint: 0.5
    left_hand_thumb_2_joint: 1.0
    left_hand_index_0_joint: -1.2
    left_hand_index_1_joint: -1.4
    left_hand_middle_0_joint: -1.2
    left_hand_middle_1_joint: -1.4
    right_hand_thumb_1_joint: -0.5
    right_hand_thumb_2_joint: -1.0
    right_hand_index_0_joint: 1.2
    right_hand_index_1_joint: 1.4
    right_hand_middle_0_joint: 1.2
    right_hand_middle_1_joint: 1.4
